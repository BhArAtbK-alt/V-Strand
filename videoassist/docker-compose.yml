services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  db:                       # optional; schema in db/schema.sql (API still uses the in-memory index)
    image: postgres:16
    environment: {POSTGRES_PASSWORD: change_me, POSTGRES_DB: videoassist}
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]

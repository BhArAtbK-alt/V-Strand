[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vstrand"
version = "0.1.0"
description = "Universal Multimodal Video Understanding & GraphRAG Framework"
requires-python = ">=3.10"
dependencies = ["numpy", "networkx", "pyyaml", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
